<head>

<style>
:root{
  --bg:#EEF2F9;--card:#fff;--blue-deep:#1B3A6B;--blue:#2E5FA3;--blue-soft:#DCE7F7;
  --orange:#F2941F;--orange-soft:#FCE9D2;--text:#1F2A3D;--muted:#5B6B82;--gray:#CBD5E3;
  --green:#2E9E5B;--green-soft:#DFF3E6;--red:#D14343;--red-soft:#FBE1E1;--purple:#7357B8;--purple-soft:#EEE8FB;
  --shadow:0 10px 30px rgba(27,58,107,.08)
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Heebo',sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:32px 16px 60px}
.katex{direction:ltr!important;unicode-bidi:isolate!important}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{width:100%;max-width:800px}.app-header{text-align:center;margin-bottom:22px}.app-header h1{font-size:2rem;font-weight:800;color:var(--blue-deep);margin:0 0 6px}.subtitle{font-size:1.03rem;color:var(--muted);font-weight:500;margin-bottom:22px}
.stepper{display:flex;align-items:center;justify-content:center;gap:0}.step{display:flex;flex-direction:column;align-items:center;gap:8px;width:76px}.step.clickable{cursor:pointer}.circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff;color:#93A2B8;border:2px solid var(--gray);transition:.2s}.step.active .circle{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(46,95,163,.35)}.step.done .circle{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}.label{font-size:.82rem;font-weight:600;color:#93A2B8}.step.active .label{color:var(--blue)}.step.done .label{color:var(--blue-deep)}.connector{width:52px;height:3px;background:var(--gray);margin:0 -2px 26px;border-radius:2px}.connector.filled{background:var(--blue)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:32px 30px;min-height:390px;margin-top:26px}.app-footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.btn{font-family:'Heebo',sans-serif;border:none;cursor:pointer;border-radius:14px;padding:13px 26px;font-size:1rem;font-weight:700;transition:.12s}.btn:active{transform:scale(.97)}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(46,95,163,.3)}.btn-primary:hover{background:var(--blue-deep)}.btn-primary:disabled{background:var(--gray);cursor:not-allowed;box-shadow:none}.btn-ghost{background:#fff;color:var(--muted);border:1.5px solid var(--gray)}.progress-text{font-size:.9rem;color:var(--muted);font-weight:600}
.stage-title{font-size:1.35rem;font-weight:800;color:var(--blue-deep);text-align:center;margin:0 0 7px}.stage-sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:.98rem;line-height:1.6}.rule-card{border-radius:16px;padding:18px 20px;margin:12px 0;border:2px solid var(--blue-soft);background:#FBFCFF}.rule-card.orange{border-color:var(--orange-soft);background:#FFFCF7}.rule-card.purple{border-color:var(--purple-soft);background:#FCFBFF}.rule-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.rule-name{font-weight:800;color:var(--blue-deep);font-size:1.05rem}.rule-formula{font-size:1.5rem}.rule-explain{color:var(--muted);line-height:1.65;margin-top:10px}.sign-positive{color:var(--green);font-weight:900}.sign-negative{color:var(--red);font-weight:900}.highlight{background:var(--orange-soft);padding:1px 7px;border-radius:7px;font-weight:700}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.mini{border:1.5px solid var(--gray);border-radius:14px;padding:16px;text-align:center}.mini .expr{font-size:1.5rem;margin-bottom:8px}.mini .result{font-weight:800;font-size:1.05rem}.note{background:var(--blue-soft);border-radius:14px;padding:14px 16px;color:var(--blue-deep);font-weight:600;line-height:1.6;margin-top:18px}
.name-gate{text-align:center;padding:28px 10px}.name-input{width:100%;max-width:320px;padding:14px 16px;font-size:1.1rem;border-radius:12px;border:2px solid var(--gray);font-family:'Heebo',sans-serif;text-align:center;margin:18px auto 6px;display:block}.name-input:focus{outline:none;border-color:var(--blue)}.name-hint{color:var(--muted);font-size:.92rem;line-height:1.6}
.explore-controls{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}.control{background:#F8FAFD;border:1.5px solid var(--gray);border-radius:14px;padding:12px 14px;min-width:150px;text-align:center}.control-label{font-size:.88rem;color:var(--muted);font-weight:700;margin-bottom:8px}.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--gray)}.seg button{flex:1;border:0;background:#fff;font-family:'Heebo';padding:8px 10px;font-weight:700;cursor:pointer;color:var(--muted)}.seg button.active{background:var(--blue);color:#fff}.stepper-ctrl{display:flex;align-items:center;justify-content:center;gap:10px}.stepper-ctrl button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gray);background:#fff;font-size:1.15rem;cursor:pointer;font-weight:800}.stepper-ctrl .val{font-size:1.35rem;font-weight:900;min-width:26px}
.explore-display{background:var(--bg);border-radius:16px;padding:24px 18px;text-align:center}.big-expr{font-size:2.4rem;min-height:58px}.expansion{font-size:1.25rem;min-height:40px;margin-top:8px}.result-box{margin-top:10px;font-size:1.05rem;color:var(--muted)}.result-box b{font-size:1.3rem}.why-box{margin-top:16px;border-radius:13px;padding:14px 16px;text-align:center;font-weight:700;line-height:1.6}.why-box.pos{background:var(--green-soft);color:#217646}.why-box.neg{background:var(--red-soft);color:#A02E2E}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.compare-item{padding:16px;border:2px solid var(--gray);border-radius:14px;text-align:center}.compare-item.active{border-color:var(--orange);background:#FFF9F1}.compare-item .expr{font-size:1.55rem;margin-bottom:6px}.compare-item .cap{font-weight:800;color:var(--blue-deep)}
.q-prompt{text-align:center;font-size:1.35rem;font-weight:700;margin:16px 0 20px;line-height:1.55}.mc-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.mc-btn{background:#fff;border:2px solid var(--gray);border-radius:10px;padding:10px 18px;font-size:1.05rem;font-weight:700;cursor:pointer;min-width:82px;font-family:'Heebo'}.mc-btn:hover{border-color:var(--blue)}.mc-btn.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}.mc-btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}.mc-btn:disabled{cursor:default}.feedback{text-align:center;margin-top:12px;font-weight:700;min-height:46px;line-height:1.5}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}.score-track{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--gray)}.dot.correct{background:var(--green)}.dot.incorrect{background:var(--red)}.example-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}.example-nav button{background:var(--blue-soft);color:var(--blue);border:0;border-radius:50%;width:38px;height:38px;font-size:1.15rem;cursor:pointer;font-weight:800}.example-nav button:disabled{opacity:.35;cursor:not-allowed}.example-nav span{font-size:.9rem;color:var(--muted);font-weight:600;min-width:120px;text-align:center}.summary{text-align:center}.summary-score{font-size:3rem;font-weight:900;color:var(--blue-deep);margin:10px}.recap-list{max-width:560px;margin:0 auto 22px;padding-right:22px;line-height:2}.recap-list li{font-size:1.03rem}
.certificate{width:100%;max-width:500px;background:#fff;border:3px solid var(--blue);border-radius:18px;padding:30px 24px;text-align:center;position:relative}.certificate:before{content:'🏆';font-size:2.2rem;display:block;margin-bottom:5px}.cert-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}.cert-title{font-size:1.3rem;font-weight:800;color:var(--blue-deep)}.cert-name{font-size:1.7rem;font-weight:900;color:var(--blue);margin:8px 0 12px}.cert-unit{font-size:1.02rem;font-weight:600;margin-bottom:14px}.cert-score{font-size:2.4rem;font-weight:900;color:var(--green)}.cert-pct{font-size:1.05rem;color:var(--muted);font-weight:700}.cert-date{font-size:.85rem;color:var(--muted);margin-top:10px}
@media(max-width:560px){body{padding:18px 10px 40px}.app-header h1{font-size:1.55rem}.card{padding:20px 14px;min-height:auto}.step{width:56px}.circle{width:32px;height:32px;font-size:.85rem}.label{font-size:.66rem}.connector{width:20px}.app-footer{flex-wrap:wrap;gap:10px;justify-content:center}.progress-text{order:3;width:100%;text-align:center}.btn{padding:11px 18px;font-size:.92rem}.mini-grid,.compare{grid-template-columns:1fr}.rule-head{flex-direction:column}.big-expr{font-size:2rem}.certificate{padding:22px 16px}.cert-name{font-size:1.35rem}.cert-score{font-size:1.9rem}}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1>חזקות: הסימן, הסוגריים והמעריך</h1>
    <div class="subtitle" id="subtitle">לפני שמתחילים</div>
    <div class="stepper" dir="ltr" id="stepper">
      <div class="step" data-step="4"><div class="circle">4</div><div class="label">מסכמים</div></div><div class="connector" id="conn34"></div>
      <div class="step" data-step="3"><div class="circle">3</div><div class="label">מתרגלים</div></div><div class="connector" id="conn23"></div>
      <div class="step" data-step="2"><div class="circle">2</div><div class="label">חוקרים</div></div><div class="connector" id="conn12"></div>
      <div class="step" data-step="1"><div class="circle">1</div><div class="label">מכירים</div></div>
    </div>
  </div>
  <div class="card" id="card"></div>
  <div class="app-footer" id="footer">
    <button class="btn btn-ghost" id="restartBtn">התחלה מחדש</button>
    <div class="progress-text" id="progressText">שלב 1 מתוך 4</div>
    <button class="btn btn-primary" id="nextBtn">בואו נחקור</button>
  </div>
</div>
<script>
function safe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function k(l){try{return katex.renderToString(l,{throwOnError:false})}catch(e){return safe(l)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const state={stage:0,name:'',explore:{negative:true,inside:true,exp:2},practice:{q:0,score:0,results:[],answers:[],questions:[]}}
const meta={1:['מכירים את הכללים','בואו נחקור'],2:['חוקרים ומשנים בעצמכם','למתרגלים'],3:['מתרגלים סימן וסוגריים','לסיכום'],4:['מסכמים ומקבלים תעודה',null]}
function renderStepper(){document.querySelectorAll('.step').forEach(el=>{let s=+el.dataset.step;el.classList.remove('active','done','clickable');if(s===state.stage)el.classList.add('active');else if(s<state.stage)el.classList.add('done','clickable')});conn12.classList.toggle('filled',state.stage>=2);conn23.classList.toggle('filled',state.stage>=3);conn34.classList.toggle('filled',state.stage>=4)}
stepper.onclick=e=>{let el=e.target.closest('.step.clickable');if(el){state.stage=+el.dataset.step;renderAll()}}
restartBtn.onclick=()=>{state.stage=0;state.name='';state.explore={negative:true,inside:true,exp:2};state.practice={q:0,score:0,results:[],answers:[],questions:[]};renderAll()}
nextBtn.onclick=()=>{if(state.stage<4){state.stage++;renderAll()}}
function renderFooter(){progressText.textContent=`שלב ${state.stage} מתוך 4`;subtitle.textContent=meta[state.stage][0];let label=meta[state.stage][1],show=!!label;if(state.stage===3)show=state.practice.questions.length&&state.practice.q>=state.practice.questions.length;nextBtn.style.visibility=show?'visible':'hidden';if(label)nextBtn.textContent=label}
function renderAll(){if(state.stage===0){stepper.style.display='none';footer.style.display='none';subtitle.textContent='לפני שמתחילים';renderName();return}stepper.style.display='flex';footer.style.display='flex';renderStepper();renderFooter();if(state.stage===1)renderStage1();if(state.stage===2)renderStage2();if(state.stage===3){if(!state.practice.questions.length)buildQuestions();renderStage3()}if(state.stage===4)renderStage4()}
function renderName(){card.innerHTML=`<div class="name-gate"><div class="stage-title">חזקות: הסימן, הסוגריים והמעריך</div><div class="name-hint">ביחידה הזאת נלמד מתי חזקה עם מספר שלילי יוצאת חיובית ומתי שלילית, ומה משתנה כשהמינוס נמצא מחוץ לסוגריים.<br>כדי לקבל תעודת סיום, כתבו את השם המלא.</div><input class="name-input" id="nameInput" placeholder="שם מלא" autocomplete="name"><button class="btn btn-primary" id="startBtn" style="margin-top:14px">בואו נתחיל</button></div>`;startBtn.disabled=true;nameInput.oninput=()=>startBtn.disabled=!nameInput.value.trim();let go=()=>{if(!nameInput.value.trim())return;state.name=nameInput.value.trim();state.stage=1;renderAll()};startBtn.onclick=go;nameInput.onkeydown=e=>{if(e.key==='Enter')go()};nameInput.focus()}
function renderStage1(){card.innerHTML=`
<div class="stage-title">קודם כל: איפה נמצא המינוס?</div>
<div class="stage-sub">אותו מינוס יכול לשנות משמעות לפי המקום שלו. לפני שמסתכלים על זוגי או אי־זוגי, בודקים מהו הבסיס של החזקה.</div>
<div class="compare">
 <div class="compare-item active"><div class="expr">${k('(-3)^2')}</div><div class="cap">המינוס בתוך הסוגריים</div><div class="rule-explain">הבסיס הוא <b>−3</b>. לכן מעלים את המספר השלילי כולו בחזקה.</div></div>
 <div class="compare-item"><div class="expr">${k('-3^2')}</div><div class="cap">המינוס מחוץ לחזקה</div><div class="rule-explain">הבסיס הוא <b>3</b>. קודם מחשבים ${k('3^2')} ורק אחר כך שמים מינוס.</div></div>
</div>
<div class="rule-card"><div class="rule-head"><div class="rule-name">בסיס חיובי</div><div class="rule-formula">${k('3^4,\;3^5')}</div></div><div class="rule-explain">חזקה של מספר חיובי תמיד נותנת תוצאה <span class="sign-positive">חיובית</span>, גם כשהמעריך זוגי וגם כשהוא אי־זוגי.</div></div>
<div class="rule-card orange"><div class="rule-head"><div class="rule-name">בסיס שלילי בתוך סוגריים</div><div class="rule-formula">${k('(-3)^n')}</div></div><div class="rule-explain"><b>מעריך זוגי</b> → התוצאה <span class="sign-positive">חיובית</span>. <b>מעריך אי־זוגי</b> → התוצאה <span class="sign-negative">שלילית</span>.</div></div>
<div class="mini-grid"><div class="mini"><div class="expr">${k('(-2)^4')}</div><div class="result sign-positive">חיובי</div><div>${k('(-2)(-2)(-2)(-2)=16')}</div></div><div class="mini"><div class="expr">${k('(-2)^3')}</div><div class="result sign-negative">שלילי</div><div>${k('(-2)(-2)(-2)=-8')}</div></div></div>
<div class="note">זכרו: אם המינוס <span class="highlight">מחוץ לסוגריים</span>, למשל ${k('-2^4')}, הוא לא חלק מהבסיס. לכן ${k('-2^4=-(2^4)=-16')}.</div>`}
function exprData(){let e=state.explore;let b=e.negative?-2:2;let latex, expansion, result;if(e.negative&&e.inside){latex=`(-2)^{${e.exp}}`;let arr=Array(e.exp).fill('(-2)');expansion=arr.join('\\cdot ');result=Math.pow(-2,e.exp)}else if(e.negative&&!e.inside){latex=`-2^{${e.exp}}`;let arr=Array(e.exp).fill('2');expansion='-('+arr.join('\\cdot ')+')';result=-Math.pow(2,e.exp)}else{latex=`2^{${e.exp}}`;let arr=Array(e.exp).fill('2');expansion=arr.join('\\cdot ');result=Math.pow(2,e.exp)}return{latex,expansion,result}}
function renderStage2(){card.innerHTML=`<div class="stage-title">שנו את הביטוי וגלו את הכלל</div><div class="stage-sub">בחרו בסיס חיובי או שלילי, החליטו אם המינוס בתוך הסוגריים, ושנו את המעריך.</div>
<div class="explore-controls">
 <div class="control"><div class="control-label">סימן</div><div class="seg"><button id="posBtn">חיובי</button><button id="negBtn">שלילי</button></div></div>
 <div class="control" id="parenControl"><div class="control-label">כשהמספר שלילי</div><div class="seg"><button id="insideBtn">בתוך סוגריים</button><button id="outsideBtn">מחוץ לסוגריים</button></div></div>
 <div class="control"><div class="control-label">מעריך</div><div class="stepper-ctrl"><button id="expMinus">−</button><div class="val" id="expVal"></div><button id="expPlus">+</button></div></div>
</div><div class="explore-display"><div class="big-expr" id="bigExpr"></div><div class="expansion" id="expansion"></div><div class="result-box" id="resultBox"></div><div class="why-box" id="whyBox"></div></div>`;
posBtn.onclick=()=>{state.explore.negative=false;updateExplore()};negBtn.onclick=()=>{state.explore.negative=true;updateExplore()};insideBtn.onclick=()=>{state.explore.inside=true;updateExplore()};outsideBtn.onclick=()=>{state.explore.inside=false;updateExplore()};expMinus.onclick=()=>{if(state.explore.exp>1){state.explore.exp--;updateExplore()}};expPlus.onclick=()=>{if(state.explore.exp<6){state.explore.exp++;updateExplore()}};updateExplore()}
function updateExplore(){let e=state.explore,d=exprData();posBtn.classList.toggle('active',!e.negative);negBtn.classList.toggle('active',e.negative);insideBtn.classList.toggle('active',e.inside);outsideBtn.classList.toggle('active',!e.inside);parenControl.style.opacity=e.negative?'1':'.4';insideBtn.disabled=outsideBtn.disabled=!e.negative;expVal.textContent=e.exp;bigExpr.innerHTML=k(d.latex);expansion.innerHTML=`${k(d.latex+'='+d.expansion)}`;resultBox.innerHTML=`התוצאה: <b class="${d.result>=0?'sign-positive':'sign-negative'}">${d.result}</b>`;let even=e.exp%2===0,msg,cls;if(!e.negative){msg=`הבסיס חיובי, לכן התוצאה חיובית. כאן לא משנה אם המעריך ${even?'זוגי':'אי־זוגי'}.`;cls='pos'}else if(!e.inside){msg=`המינוס נמצא מחוץ לחזקה. קודם מחשבים חזקה חיובית ואז מוסיפים מינוס — לכן התוצאה שלילית.`;cls='neg'}else if(even){msg=`הבסיס שלילי והמעריך זוגי. יש מספר זוגי של גורמים שליליים, ולכן התוצאה חיובית.`;cls='pos'}else{msg=`הבסיס שלילי והמעריך אי־זוגי. נשאר גורם שלילי אחד ללא בן זוג, ולכן התוצאה שלילית.`;cls='neg'}whyBox.className='why-box '+cls;whyBox.textContent=msg}
function buildQuestions(){let qs=[
 {latex:'(-3)^4',q:'מה יהיה סימן התוצאה?',opts:['חיובית','שלילית'],c:'חיובית',ex:'הבסיס שלילי והמעריך 4 זוגי.'},
 {latex:'(-3)^5',q:'מה יהיה סימן התוצאה?',opts:['חיובית','שלילית'],c:'שלילית',ex:'הבסיס שלילי והמעריך 5 אי־זוגי.'},
 {latex:'4^7',q:'מה יהיה סימן התוצאה?',opts:['חיובית','שלילית'],c:'חיובית',ex:'בסיס חיובי נותן תוצאה חיובית בכל מעריך טבעי.'},
 {latex:'-4^2',q:'מה יהיה סימן התוצאה?',opts:['חיובית','שלילית'],c:'שלילית',ex:'המינוס מחוץ לחזקה: -(4²).'},
 {latex:'(-5)^2',q:'איזה מספר הוא הבסיס?',opts:['5','−5','2'],c:'−5',ex:'הסוגריים מכניסים את המינוס לתוך הבסיס.'},
 {latex:'-5^2',q:'איזה מספר הוא הבסיס של החזקה?',opts:['5','−5','2'],c:'5',ex:'המינוס נמצא מחוץ לחזקה; רק 5 הוא הבסיס.'},
 {latex:'(-2)^3',q:'כמה שווה הביטוי?',opts:['8','−8','6','−6'],c:'−8',ex:'(-2)·(-2)·(-2) = -8.'},
 {latex:'(-2)^4',q:'כמה שווה הביטוי?',opts:['16','−16','8','−8'],c:'16',ex:'ארבעה גורמים שליליים נותנים תוצאה חיובית.'},
 {latex:'-2^4',q:'כמה שווה הביטוי?',opts:['16','−16','8','−8'],c:'−16',ex:'קודם 2⁴=16, ואז המינוס שמחוץ לחזקה.'},
 {latex:'(-6)^9',q:'בלי לחשב את כל החזקה: מה אפשר לדעת?',opts:['התוצאה חיובית','התוצאה שלילית','התוצאה אפס'],c:'התוצאה שלילית',ex:'בסיס שלילי ומעריך אי־זוגי → תוצאה שלילית.'}
];state.practice.questions=qs.map(x=>({...x,opts:shuffle(x.opts)}))}
function renderStage3(){let p=state.practice;if(p.q>=p.questions.length){card.innerHTML=`<div class="summary"><div class="stage-title">סיימתם את התרגול!</div><div class="summary-score">${p.score}/${p.questions.length}</div><div class="stage-sub">אפשר לעבור לסיכום ולתעודה. ניתן גם לחזור לשאלות הקודמות דרך החץ.</div><div class="example-nav"><button id="backSum">▶</button><span>חזרה לשאלה האחרונה</span></div></div>`;backSum.onclick=()=>{p.q--;renderStage3();renderFooter()};renderFooter();return}let q=p.questions[p.q],answered=p.q<p.results.length;card.innerHTML=`<div class="score-track" id="track"></div><div class="q-prompt"><span class="ltr">${k(q.latex)}</span><br>${safe(q.q)}</div><div class="mc-row" id="row"></div><div class="feedback" id="fb"></div><div class="example-nav"><button id="backQ">▶</button><span>שאלה ${p.q+1} מתוך ${p.questions.length}</span><button id="forwardQ">◀</button></div>`;renderTrack();q.opts.forEach(opt=>{let b=document.createElement('button');b.className='mc-btn';b.textContent=opt;if(!answered)b.onclick=()=>answer(opt,q);else b.disabled=true;row.appendChild(b)});if(answered){paintAnswered(q);let ok=p.results[p.q];fb.className='feedback '+(ok?'ok':'bad');fb.textContent=(ok?'נכון! ':'לא נכון. ')+q.ex}backQ.disabled=p.q===0;forwardQ.disabled=!answered;backQ.onclick=()=>{if(p.q>0){p.q--;renderStage3();renderFooter()}};forwardQ.onclick=()=>{if(p.q<p.results.length){p.q++;renderStage3();renderFooter()}}}
function renderTrack(){track.innerHTML='';state.practice.questions.forEach((_,i)=>{let d=document.createElement('div');d.className='dot';if(i<state.practice.results.length)d.classList.add(state.practice.results[i]?'correct':'incorrect');track.appendChild(d)})}
function answer(chosen,q){let p=state.practice,ok=chosen===q.c;p.answers.push(chosen);p.results.push(ok);if(ok)p.score++;Array.from(row.children).forEach(b=>b.disabled=true);paintAnswered(q);fb.className='feedback '+(ok?'ok':'bad');fb.textContent=(ok?'נכון! ':'לא נכון. ')+q.ex;renderTrack();forwardQ.disabled=false}
function paintAnswered(q){let chosen=state.practice.answers[state.practice.q];Array.from(row.children).forEach(b=>{if(b.textContent===q.c)b.classList.add('correct');else if(b.textContent===chosen)b.classList.add('wrong')})}
const UNIT_NAME='חזקות – סימן, סוגריים ומעריך זוגי או אי־זוגי';
function renderStage4(){let p=state.practice,pct=Math.round(p.score/p.questions.length*100),date=new Date().toLocaleDateString('he-IL');card.innerHTML=`<div class="stage-title">מה חשוב לזכור?</div><ul class="recap-list"><li>בסיס <b>חיובי</b> → התוצאה חיובית.</li><li>בסיס <b>שלילי בתוך סוגריים</b> + מעריך <b>זוגי</b> → תוצאה חיובית.</li><li>בסיס <b>שלילי בתוך סוגריים</b> + מעריך <b>אי־זוגי</b> → תוצאה שלילית.</li><li>בביטוי כמו ${k('-3^2')} המינוס <b>אינו חלק מהבסיס</b>: ${k('-3^2=-(3^2)=-9')}.</li><li>תמיד בודקים קודם: <b>מהו הבסיס?</b> ורק אחר כך אם המעריך זוגי או אי־זוגי.</li></ul><div class="cert-wrap"><div class="certificate" id="certificate"><div class="cert-title">תעודת סיום יחידה</div><div class="cert-name">${safe(state.name||'תלמיד/ה')}</div><div class="cert-unit">${safe(UNIT_NAME)}</div><div class="cert-score">${p.score}/${p.questions.length}</div><div class="cert-pct">אחוז הצלחה: ${pct}%</div><div class="cert-date">${safe(date)}</div></div><button class="btn btn-primary" id="downloadCert">הורידו תעודה כתמונה</button></div><div style="text-align:center;color:var(--muted);margin-top:16px">אפשר לחזור לשלבים קודמים דרך הסרגל למעלה ולתרגל שוב.</div>`;downloadCert.onclick=async()=>{let old=downloadCert.textContent;downloadCert.disabled=true;downloadCert.textContent='מכינים תמונה...';try{let canvas=await html2canvas(certificate,{useCORS:true,backgroundColor:'#fff',scale:2});let a=document.createElement('a');a.download=`תעודה_${(state.name||'תלמיד').replace(/\s+/g,'_')}.png`;a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('לא ניתן היה ליצור את התמונה. אפשר לצלם מסך של התעודה במקום.')}downloadCert.disabled=false;downloadCert.textContent=old}}
window.addEventListener('DOMContentLoaded',renderAll)
</script>
